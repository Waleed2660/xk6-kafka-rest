version: '3.8'

services:

  # ────────────────────────────────────────────
  # 1. Zookeeper
  # ────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # ────────────────────────────────────────────
  # 2. Kafka Broker
  # ────────────────────────────────────────────
  broker:
    image: confluentinc/cp-kafka:7.6.0
    container_name: broker
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CLUSTER_ID: "local-dev-cluster-0001"

  # ────────────────────────────────────────────
  # 3. Mock OAuth2 Server (acts as the IDP)
  #    Token URL: http://localhost:8080/default/token
  #    Use any client_id / client_secret — mock accepts all
  # ────────────────────────────────────────────
  oauth:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    container_name: oauth
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      # Accepts any client_credentials request without validation
      JSON_CONFIG: |
        {
          "interactiveLogin": false,
          "httpServer": "NettyWrapper",
          "tokenCallbacks": [
            {
              "issuerId": "default",
              "tokenExpiry": 3600,
              "requestMappings": [
                {
                  "requestParam": "grant_type",
                  "match": "client_credentials",
                  "claims": {
                    "sub": "test-client",
                    "aud": "kafka-rest"
                  }
                }
              ]
            }
          ]
        }

  # ────────────────────────────────────────────
  # 4. Kafbat UI — browse topics & messages
  #    Open: http://localhost:8090
  # ────────────────────────────────────────────
  kafbat:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafbat
    depends_on:
      - broker
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:9092

  # ────────────────────────────────────────────
  # 5. Confluent REST Proxy
  #    Producer endpoint: http://localhost:8082/topics/{topic}
  #    No auth enforcement here — the extension sends the Bearer
  #    token and REST Proxy forwards it to the broker (PLAINTEXT
  #    locally, so the token is accepted but not validated by Kafka)
  # ────────────────────────────────────────────
  rest-proxy:
    image: confluentinc/cp-kafka-rest:7.6.0
    container_name: rest-proxy
    depends_on:
      - broker
      - oauth
    ports:
      - "8082:8082"
    environment:
      KAFKA_REST_HOST_NAME: rest-proxy
      KAFKA_REST_BOOTSTRAP_SERVERS: broker:9092
      KAFKA_REST_LISTENERS: http://0.0.0.0:8082
      # Accept JSON producer requests
      KAFKA_REST_CONSUMER_REQUEST_TIMEOUT_MS: 5000

