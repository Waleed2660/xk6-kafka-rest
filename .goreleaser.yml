# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: xk6-kafka-rest

before:
  hooks:
    - go mod tidy
    - go install go.k6.io/xk6/cmd/xk6@latest

builds:
  - id: k6-linux-amd64
    builder: custom
    binary: k6
    goos: [linux]
    goarch: [amd64]
    command: >-
      xk6 build
      --with github.com/Waleed2660/xk6-kafka-rest=.
      --output {{ .Name }}

  - id: k6-linux-arm64
    builder: custom
    binary: k6
    goos: [linux]
    goarch: [arm64]
    command: >-
      xk6 build
      --with github.com/Waleed2660/xk6-kafka-rest=.
      --output {{ .Name }}

  - id: k6-darwin-amd64
    builder: custom
    binary: k6
    goos: [darwin]
    goarch: [amd64]
    command: >-
      xk6 build
      --with github.com/Waleed2660/xk6-kafka-rest=.
      --output {{ .Name }}

  - id: k6-darwin-arm64
    builder: custom
    binary: k6
    goos: [darwin]
    goarch: [arm64]
    command: >-
      xk6 build
      --with github.com/Waleed2660/xk6-kafka-rest=.
      --output {{ .Name }}

  - id: k6-windows-amd64
    builder: custom
    binary: k6
    goos: [windows]
    goarch: [amd64]
    command: >-
      xk6 build
      --with github.com/Waleed2660/xk6-kafka-rest=.
      --output {{ .Name }}.exe

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - CHANGELOG.md
      - LICENSE
      - index.d.ts

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: Waleed2660
    name: xk6-kafka-rest
  header: |
    ## xk6-kafka-rest {{ .Tag }}

    Custom k6 binary with Kafka REST Proxy + OAuth 2.0 support.

    **Install — download the binary for your platform from the assets below, then:**
    ```bash
    chmod +x k6        # Linux / macOS
    ./k6 version
    ```
  footer: |
    ---
    Full changelog: https://github.com/Waleed2660/xk6-kafka-rest/blob/main/CHANGELOG.md

changelog:
  use: github
  sort: asc
  groups:
    - title: "✨ New Features"
      regexp: "^feat"
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: "^fix"
      order: 1
    - title: "🔧 Maintenance"
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"

